[package]
name = "payeebook"
version = "1.0.0"
description = "Accounts for Social Security representative payees, guardians and conservators"
authors = ["Joel Stain Lobo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/lobojoel2003/Payeebook"
homepage = "https://github.com/lobojoel2003/Payeebook"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "payeebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
